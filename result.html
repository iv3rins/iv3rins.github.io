<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可爱大乱斗 - 游戏结算</title>
    <style>
        /* ================= 基础与全局设定 ================= */
        :root {
            --bg-color: #fef6f5;       
            --primary: #ffb6c1;        
            --text-main: #2d3436;
            --font-cute: 'Comic Sans MS', 'Microsoft YaHei', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            /* 结算页面为了体现弹窗感，背景可以稍微深一点或者带有一点透明度 */
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            color: var(--text-main);
            font-family: var(--font-cute);
            overflow: hidden;
            /* 可爱的小猫爪鼠标指针 */
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"><text y="22" font-size="20">🐾</text></svg>'), auto;
        }

        /* ================= 动画库 ================= */
        @keyframes popIn { 
            0% { transform: scale(0.8); opacity: 0; } 
            80% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes floatTrophy {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* 通用按钮样式 */
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            font-size: 16px;
            font-family: inherit;
            cursor: inherit;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(255, 182, 193, 0.4);
            font-weight: bold;
        }
        .btn:hover { transform: scale(1.05); filter: brightness(1.05); }
        .btn:active { transform: scale(0.95); }
        .btn-secondary { background: #b2bec3; box-shadow: 0 4px 6px rgba(178, 190, 195, 0.4); }

        /* ================= 结算页面特定样式 ================= */
        .result-container { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            background: rgba(254, 246, 245, 0.95); /* 半透明遮罩感 */
        }
        
        .result-panel { 
            background: white; 
            padding: 40px 50px; 
            border-radius: 30px; 
            text-align: center; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.15); 
            border: 4px solid var(--primary); 
            animation: popIn 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        
        .ribbon { 
            font-size: 32px; 
            color: #ff7675; 
            font-weight: bold; 
            margin-bottom: 30px; 
            animation: floatTrophy 3s ease-in-out infinite;
        }
        
        .stats-list { 
            background: #fef9f9; 
            padding: 25px 30px; 
            border-radius: 15px; 
            text-align: left; 
            list-style: none; 
            margin-bottom: 35px; 
            border: 2px dashed var(--primary); 
        }
        
        .stats-list li { 
            margin: 18px 0; 
            font-size: 18px; 
            display: flex; 
            align-items: center; 
        }
        
        .stats-list .icon { 
            font-size: 26px; 
            margin-right: 15px; 
        }
        
        .stats-list .label { 
            font-weight: bold; 
            color: var(--text-main); 
            margin-right: 15px; 
            width: 120px; /* 对齐文本 */
        }
        
        .stats-list .value { 
            color: #d63031; 
            font-weight: bold;
        }
        
        .result-actions { 
            display: flex; 
            gap: 20px; 
            justify-content: center; 
        }
    </style>
</head>
<body>

    <div class="result-container">
        <div class="result-panel">
            <div class="ribbon">🏆 游戏结束 🏆</div>
            
            <ul class="stats-list">
                <li>
                    <span class="icon">👑</span> 
                    <span class="label">最终赢家:</span> 
                    <span class="value" id="stat-winner">自己 (小猫猫)</span>
                </li>
                <li>
                    <span class="icon">⚔️</span> 
                    <span class="label">造成最高伤害:</span> 
                    <span class="value" id="stat-damage">120 点</span>
                </li>
                <li>
                    <span class="icon">💀</span> 
                    <span class="label">最先出局:</span> 
                    <span class="value" id="stat-first-dead">玩家2 (🐰)</span>
                </li>
            </ul>

            <div class="result-actions">
                <button class="btn" onclick="restartGame()">🔄 再来一局</button>
                <button class="btn btn-secondary" onclick="leaveRoom()">🚪 退出房间</button>
            </div>
        </div>
    </div>

    <script>
        // 供底层逻辑调用的基础交互接口
        function restartGame() {
            console.log("玩家请求：再来一局");
            // 此处留给底层逻辑：通知服务器/其他玩家准备，并跳转或重置回 game.html
        }

        function leaveRoom() {
            console.log("玩家请求：退出房间");
            // 此处留给底层逻辑：清理房间状态，并跳转回 home.html
        }

        // 用于更新战绩的外部接口示例（由 AI 在对接 gameCore.js 时调用）
        function updateStats(winner, maxDamage, firstDead) {
            document.getElementById('stat-winner').innerText = winner;
            document.getElementById('stat-damage').innerText = maxDamage + ' 点';
            document.getElementById('stat-first-dead').innerText = firstDead;
        }
    </script>
</body>
</html>
