<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可爱大乱斗 - 游戏对局</title>
    <style>
        /* ================= 基础与全局设定 ================= */
        :root {
            --bg-color: #fef6f5;       
            --primary: #ffb6c1;        
            --self-border: #4facfe;    /* 玩家自己的蓝色高亮边框 */
            --hp-color: #ff7675;       
            --shield-color: #74b9ff;   
            --text-main: #2d3436;
            --card-bg: #ffffff;
            --font-cute: 'Comic Sans MS', 'Microsoft YaHei', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; 
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-cute);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
            /* 可爱的小猫爪鼠标指针 */
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"><text y="22" font-size="20">🐾</text></svg>'), auto;
        }

        /* 隐藏滚动条 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        /* ================= 动画库 ================= */
        @keyframes bounceHover { 
            0%, 100% { transform: translateY(0); } 
            50% { transform: translateY(-5px); } 
        }
        @keyframes cardPick { 
            from { transform: translateY(0); } 
            to { transform: translateY(-20px) scale(1.05); box-shadow: 0 10px 20px rgba(0,0,0,0.15); } 
        }
        @keyframes attackDash { 
            0% { transform: translate(0, 0) scale(1.05); } 
            50% { transform: translate(30px, -60px) scale(1.1); opacity: 0.8; }
            100% { transform: translate(0, 0) scale(1); opacity: 0; }
        }
        @keyframes timerShrink { 
            from { width: 100%; background: #55efc4; } 
            50% { background: #ffeaa7; } 
            to { width: 0%; background: #ff7675; } 
        }

        /* 通用按钮样式 */
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-family: inherit;
            cursor: inherit;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(255, 182, 193, 0.4);
            font-weight: bold;
        }
        .btn:hover { transform: scale(1.05); filter: brightness(1.05); }
        .btn:active { transform: scale(0.95); }

        /* ================= 布局：对手区域 (上) ================= */
        .opponents-area { 
            position: absolute; 
            top: 50px; 
            left: 50px; 
            right: 350px; /* 留出聊天框位置 */
            display: flex; 
            gap: 30px; 
            flex-wrap: wrap;
        }
        
        .player-card {
            background: white; 
            border: 3px solid #eee; 
            border-radius: 15px; 
            width: 130px; 
            padding: 15px 10px;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: 0.3s;
            position: relative;
        }
        .player-card.targetable:hover { 
            border-color: var(--primary); 
            transform: translateY(-10px) scale(1.05); 
        }
        
        .player-card .name { font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .player-card .avatar { font-size: 35px; animation: bounceHover 3s infinite; }
        .player-card .role { font-size: 20px; font-weight: bold; margin: 8px 0; }
        .suit-red { color: #d63031; }
        .suit-black { color: #2d3436; }
        
        .status-bar { 
            width: 100%; height: 10px; border-radius: 5px; background: #eee; margin-top: 5px; position: relative; overflow: hidden; 
        }
        .status-hp { height: 100%; background: var(--hp-color); transition: width 0.3s; }
        .status-shield { height: 100%; background: var(--shield-color); position: absolute; top:0; left:0; transition: width 0.3s; opacity: 0.8; }
        .hand-count { 
            position: absolute; bottom: -10px; right: -10px; background: var(--text-main); color: white; border-radius: 50%; width: 25px; height: 25px; line-height: 25px; text-align: center; font-size: 12px; font-weight: bold;
        }

        /* ================= 布局：自己区域 (左下) ================= */
        .self-area { 
            position: absolute; 
            bottom: 30px; 
            left: 50px; 
        }
        .self-area .player-card { 
            border: 4px solid var(--self-border); 
            width: 150px; 
            padding: 20px 15px; 
            box-shadow: 0 0 15px rgba(79, 172, 254, 0.3);
        }

        /* ================= 布局：操作与手牌区域 (中下) ================= */
        .action-area { 
            position: absolute; 
            bottom: 170px; 
            left: 230px; 
            display: flex; 
            flex-direction: column; 
            align-items: flex-start; 
            gap: 15px; 
        }
        .timer-bar-bg { 
            width: 250px; height: 12px; background: #eee; border-radius: 6px; overflow: hidden; 
        }
        .timer-bar-fill { height: 100%; }
        .timer-active .timer-bar-fill { animation: timerShrink 30s linear forwards; }

        .hand-area { 
            position: absolute; 
            bottom: 30px; 
            left: 230px; 
            display: flex; 
            gap: -25px; /* 卡牌层叠 */
        }
        .poker-card {
            width: 90px; height: 130px; background: var(--card-bg); border: 2px solid #ddd; border-radius: 10px;
            box-shadow: -3px 0 12px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 28px; font-weight: bold; transition: 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            margin-left: -30px; 
            position: relative;
        }
        .hand-area .poker-card:first-child { margin-left: 0; }
        .poker-card:hover { transform: translateY(-15px) !important; z-index: 10; border-color: var(--primary); }
        .poker-card.selected { animation: cardPick 0.2s forwards; border-color: var(--primary); z-index: 20; }
        .card-joker { color: #8e44ad; }

        /* ================= 布局：聊天框 (右) ================= */
        .chat-box { 
            position: absolute; 
            right: 30px; 
            top: 50px; 
            bottom: 30px; 
            width: 300px; 
            background: white; 
            border: 3px solid #eee; 
            border-radius: 20px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .chat-messages { 
            flex: 1; padding: 15px; overflow-y: auto; font-size: 14px; display: flex; flex-direction: column; gap: 10px;
        }
        .msg.system { color: #b2bec3; font-size: 12px; text-align: center; }
        .msg.user { background: #fef6f5; padding: 8px 12px; border-radius: 10px; align-self: flex-start; max-width: 90%; }
        
        .chat-input { display: flex; border-top: 2px solid #eee; }
        .chat-input input { flex: 1; border: none; padding: 15px; outline: none; font-family: inherit; font-size: 14px; }
        .chat-input button { background: var(--primary); color: white; border: none; padding: 0 20px; font-family: inherit; font-weight: bold; }
        .chat-input button:hover { filter: brightness(1.05); }

        /* 动画专用顶层 */
        .anim-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 999; }
    </style>
</head>
<body onload="startTimer()">

    <!-- 其他玩家区域 (上方) -->
    <div class="opponents-area" id="opponents-container">
        <!-- 玩家1 -->
        <div class="player-card targetable" onclick="selectTarget(this, 'player1')">
            <div class="name">玩家1</div>
            <div class="avatar">🐶</div>
            <div class="role suit-red">♥K</div>
            <div class="status-bar">
                <div class="status-hp" style="width: 100%;"></div>
                <div class="status-shield" style="width: 0%;"></div>
            </div>
            <div class="hand-count">5</div>
        </div>
        <!-- 玩家2 -->
        <div class="player-card targetable" onclick="selectTarget(this, 'player2')">
            <div class="name">玩家2</div>
            <div class="avatar">🐰</div>
            <div class="role suit-black">♠Q</div>
            <div class="status-bar">
                <div class="status-hp" style="width: 60%;"></div>
                <div class="status-shield" style="width: 30%;"></div>
            </div>
            <div class="hand-count">3</div>
        </div>
    </div>

    <!-- 自己区域 (左下) -->
    <div class="self-area">
        <div class="player-card">
            <div class="name">自己 (小猫猫)</div>
            <div class="avatar">🐱</div>
            <div class="role suit-red">♦J</div>
            <div class="status-bar">
                <div class="status-hp" style="width: 80%;"></div>
                <div class="status-shield" style="width: 10%;"></div>
            </div>
        </div>
    </div>

    <!-- 操作区域与手牌 (中下) -->
    <div class="action-area">
        <button class="btn" id="attack-btn" onclick="executeAttack()">⚔️ 选择一个玩家，攻击</button>
        <div class="timer-bar-bg">
            <div class="timer-bar-fill" id="turn-timer"></div>
        </div>
    </div>

    <div class="hand-area" id="hand-container">
        <div class="poker-card suit-red" onclick="toggleCard(this)"><span>♦</span><span>6</span></div>
        <div class="poker-card suit-red" onclick="toggleCard(this)"><span>♥</span><span>6</span></div>
        <div class="poker-card suit-black" onclick="toggleCard(this)"><span>♠</span><span>7</span></div>
        <div class="poker-card card-joker" onclick="toggleCard(this)"><span>🃏</span><span style="font-size: 18px;">Joker</span></div>
    </div>

    <!-- 聊天框 (右侧) -->
    <div class="chat-box">
        <div class="chat-messages" id="chat-messages">
            <div class="msg system">游戏开始，请出牌！</div>
            <div class="msg user"><b>玩家1:</b> 哈哈我拿到K了！</div>
        </div>
        <div class="chat-input">
            <input type="text" placeholder="输入聊天内容..." id="chat-input-text">
            <button onclick="sendChat()">发送</button>
        </div>
    </div>
    
    <!-- 动画层 -->
    <div class="anim-layer" id="anim-layer"></div>

    <script>
        // ================= UI 交互逻辑 =================
        let currentTarget = null;
        let timerTimeout;

        // 1. 卡牌选中逻辑
        function toggleCard(cardElement) {
            cardElement.classList.toggle('selected');
        }

        // 2. 目标选择逻辑
        function selectTarget(targetElement, playerId) {
            // 清除其他高亮
            document.querySelectorAll('.player-card.targetable').forEach(el => {
                el.style.borderColor = '#eee';
                el.style.transform = 'none';
            });
            // 设定当前高亮
            targetElement.style.borderColor = 'var(--hp-color)';
            targetElement.style.transform = 'translateY(-10px) scale(1.05)';
            currentTarget = targetElement;
            console.log("选中目标:", playerId);
        }

        // 3. 攻击/出牌执行逻辑
        function executeAttack() {
            const selectedCards = document.querySelectorAll('.poker-card.selected');
            if (selectedCards.length === 0) return alert("请先选择要打出的牌哦！🐾");
            if (!currentTarget) return alert("请先选择一个攻击目标哦！🐾");

            const animLayer = document.getElementById('anim-layer');
            
            // 制作飞行动画
            selectedCards.forEach((card, index) => {
                let rect = card.getBoundingClientRect();
                let clone = card.cloneNode(true);
                clone.style.position = 'absolute';
                clone.style.left = rect.left + 'px';
                clone.style.top = rect.top + 'px';
                clone.style.margin = '0'; 
                // 稍微错开每张牌的动画时间，增加流畅感
                clone.style.animation = `attackDash 0.5s ease-in forwards ${index * 0.05}s`;
                animLayer.appendChild(clone);
                
                setTimeout(() => { clone.remove(); }, 600);
            });

            // 移除打出的手牌 (UI层面演示)
            selectedCards.forEach(card => card.remove());
            
            // 重置目标 UI
            currentTarget.style.borderColor = '#eee';
            currentTarget.style.transform = 'none';
            currentTarget = null;

            // 重置倒计时
            resetTimer();
            
            // 此处留给底层逻辑：将选中的数据传递给 CoreEngine 进行实际的规则结算
        }

        // 4. 30秒读秒控制逻辑
        function startTimer() {
            const timerBar = document.querySelector('.timer-bar-bg');
            timerBar.classList.remove('timer-active');
            void timerBar.offsetWidth; // 触发重排以重启 CSS 动画
            timerBar.classList.add('timer-active');

            // 30秒后强制随机出牌
            timerTimeout = setTimeout(() => {
                forceRandomPlay();
            }, 30000);
        }

        function resetTimer() {
            clearTimeout(timerTimeout);
            startTimer(); 
        }

        function forceRandomPlay() {
            const cards = document.querySelectorAll('#hand-container .poker-card');
            if(cards.length > 0) {
                cards[0].classList.add('selected'); // 随机选第一张
                selectTarget(document.querySelector('.player-card.targetable'), 'player_random');
                setTimeout(executeAttack, 500);
            }
        }

        // 5. 聊天功能演示
        function sendChat() {
            const input = document.getElementById('chat-input-text');
            const text = input.value.trim();
            if (!text) return;
            
            const msgBox = document.getElementById('chat-messages');
            const newMsg = document.createElement('div');
            newMsg.className = 'msg user';
            newMsg.innerHTML = `<b>自己:</b> ${text}`;
            msgBox.appendChild(newMsg);
            
            input.value = '';
            msgBox.scrollTop = msgBox.scrollHeight; // 滚动到底部
        }
    </script>
</body>
</html>
