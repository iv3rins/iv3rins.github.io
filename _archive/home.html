<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可爱大乱斗 - 主页大厅</title>
    <style>
        /* ================= 基础与全局设定 ================= */
        :root {
            --bg-color: #fef6f5;       /* 整体柔和背景 */
            --primary: #ffb6c1;        /* 可爱粉色主色调 */
            --text-main: #2d3436;
            --font-cute: 'Comic Sans MS', 'Microsoft YaHei', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-cute);
            overflow: hidden;
            /* 可爱的小猫爪鼠标指针 */
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"><text y="22" font-size="20">🐾</text></svg>'), auto;
        }

        /* ================= 动画库 ================= */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes bounceHover { 
            0%, 100% { transform: translateY(0); } 
            50% { transform: translateY(-10px); } 
        }

        /* 通用按钮样式 */
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            font-size: 16px;
            font-family: inherit;
            cursor: inherit;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(255, 182, 193, 0.4);
            font-weight: bold;
        }
        .btn:hover { transform: scale(1.05); filter: brightness(1.05); }
        .btn:active { transform: scale(0.95); }
        .btn-secondary { background: #a29bfe; box-shadow: 0 4px 6px rgba(162, 155, 254, 0.4); }

        /* ================= 主页特定样式 ================= */
        .home-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            animation: fadeIn 0.5s ease-in-out;
        }

        .diy-box { 
            background: white; 
            padding: 40px; 
            border-radius: 25px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            text-align: center; 
            border: 3px solid white;
            transition: 0.3s;
        }
        .diy-box:hover {
            border-color: var(--primary);
        }

        .avatar-preview { 
            width: 100px; 
            height: 100px; 
            background: #ffeaa7; 
            border-radius: 50%; 
            margin: 0 auto 20px; 
            line-height: 100px; 
            font-size: 50px; 
            animation: bounceHover 3s infinite;
        }

        .diy-box h2 {
            margin-bottom: 20px;
            color: #ff7675;
        }

        .input-group input, .join-group input { 
            width: 100%;
            margin: 10px 0; 
            padding: 12px; 
            border: 2px solid #eee; 
            border-radius: 15px; 
            text-align: center; 
            outline: none; 
            font-family: inherit; 
            font-size: 16px;
            transition: 0.3s;
        }
        .input-group input:focus, .join-group input:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 10px rgba(255, 182, 193, 0.3);
        }

        .room-actions { 
            margin-top: 25px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }

        .join-group { 
            display: flex; 
            gap: 10px; 
            justify-content: center; 
        }
        .join-group input {
            margin: 0;
            width: 140px;
        }
    </style>
</head>
<body>

    <div class="home-container">
        <div class="diy-box">
            <!-- 角色 DIY 预览 -->
            <div class="avatar-preview">🐱</div>
            <h2>DIY 你的可爱角色</h2>
            
            <!-- 玩家命名区 -->
            <div class="input-group">
                <input type="text" id="player-name" placeholder="输入可爱的昵称..." value="小猫猫">
            </div>
            
            <!-- 房间操作区 -->
            <div class="room-actions">
                <!-- 创建房间 -->
                <button class="btn" onclick="createRoom()">
                    ✨ 创建房间 (生成邀请码)
                </button>
                
                <!-- 加入房间 -->
                <div class="join-group">
                    <input type="text" id="room-code" placeholder="4位邀请码" maxlength="4">
                    <button class="btn btn-secondary" onclick="joinRoom()">加入</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 供底层逻辑调用的基础交互接口
        function createRoom() {
            const playerName = document.getElementById('player-name').value;
            console.log("创建房间，玩家昵称:", playerName);
            // 此处留给底层逻辑：生成房间号并跳转到 game.html
        }

        function joinRoom() {
            const playerName = document.getElementById('player-name').value;
            const roomCode = document.getElementById('room-code').value;
            if (roomCode.length !== 4) {
                alert("请输入4位可爱的邀请码哦！");
                return;
            }
            console.log("加入房间:", roomCode, "玩家昵称:", playerName);
            // 此处留给底层逻辑：校验房间号并跳转到 game.html
        }
    </script>
</body>
</html>
