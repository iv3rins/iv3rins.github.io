<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可爱大乱斗 - 等待加入</title>
    <style>
        /* ================= 基础与全局设定 ================= */
        :root {
            --bg-color: #fef6f5;       
            --primary: #ffb6c1;        
            --self-border: #4facfe;    
            --text-main: #2d3436;
            --font-cute: 'Comic Sans MS', 'Microsoft YaHei', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; 
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-cute);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            /* 可爱的小猫爪鼠标指针 */
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"><text y="22" font-size="20">🐾</text></svg>'), auto;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        /* ================= 动画库 ================= */
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes bounceHover { 
            0%, 100% { transform: translateY(0); } 
            50% { transform: translateY(-8px); } 
        }

        /* 通用按钮样式 */
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            font-size: 16px;
            font-family: inherit;
            cursor: inherit;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(255, 182, 193, 0.4);
            font-weight: bold;
        }
        .btn:hover { transform: scale(1.05); filter: brightness(1.05); }
        .btn:active { transform: scale(0.95); }
        .btn-secondary { background: #b2bec3; box-shadow: 0 4px 6px rgba(178, 190, 195, 0.4); }
        .btn-small { padding: 5px 15px; font-size: 14px; margin-left: 10px; }

        /* ================= 布局：等待大厅主容器 ================= */
        .waiting-container {
            display: flex;
            height: 100vh;
            padding: 40px 50px;
            gap: 30px;
            animation: fadeIn 0.4s ease-out;
        }

        /* 左侧主区域：房间信息与玩家网格 */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            padding: 30px;
            border: 3px solid #eee;
        }

        .room-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .room-header h2 {
            color: #ff7675;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .room-code-display {
            font-size: 20px;
            font-weight: bold;
            background: #fdf6f6;
            display: inline-block;
            padding: 10px 25px;
            border-radius: 15px;
            border: 2px dashed var(--primary);
        }
        .room-code-display span {
            color: #d63031;
            font-size: 24px;
            letter-spacing: 2px;
            margin-left: 5px;
        }

        /* 玩家网格 (自适应，满足4-12人需求) */
        .players-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
            align-content: start;
            overflow-y: auto;
            padding: 10px;
        }

        .player-slot {
            background: #fdfdfd; 
            border: 3px solid #eee; 
            border-radius: 15px; 
            height: 160px;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            transition: 0.3s;
            position: relative;
        }
        
        /* 已占用槽位 */
        .player-slot.occupied {
            background: white;
            border-color: var(--primary);
            box-shadow: 0 5px 15px rgba(255, 182, 193, 0.2);
        }
        /* 空槽位 */
        .player-slot.empty {
            border-style: dashed;
            background: #f5f6fa;
            color: #b2bec3;
        }
        /* 房主专属边框 */
        .player-slot.host {
            border-color: #fdcb6e;
            box-shadow: 0 5px 15px rgba(253, 203, 110, 0.3);
        }

        .player-slot .avatar { font-size: 45px; margin-bottom: 10px; }
        .cute-bounce { animation: bounceHover 3s infinite; }
        .player-slot .name { font-weight: bold; font-size: 15px; text-align: center; width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        
        .status-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #55efc4;
            color: #2d3436;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 10px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .host-badge { background: #ffeaa7; color: #d35400; left: -10px; right: auto; }

        /* 底部操作区 */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed #eee;
        }

        /* ================= 布局：聊天框 (右侧) ================= */
        .chat-sidebar {
            width: 320px;
            background: white;
            border: 3px solid #eee;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        
        .chat-header {
            background: #fdf6f6;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            color: #ff7675;
            border-bottom: 2px solid #eee;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg.system { color: #b2bec3; font-size: 12px; text-align: center; margin: 5px 0;}
        .msg.user { background: #fef6f5; padding: 8px 12px; border-radius: 10px; align-self: flex-start; max-width: 90%; word-break: break-all;}
        .msg.self { background: #e3f2fd; align-self: flex-end; }
        
        .chat-input { display: flex; border-top: 2px solid #eee; }
        .chat-input input { flex: 1; border: none; padding: 15px; outline: none; font-family: inherit; font-size: 14px; }
        .chat-input button { background: var(--primary); color: white; border: none; padding: 0 20px; font-family: inherit; font-weight: bold; }
        .chat-input button:hover { filter: brightness(1.05); }
    </style>
</head>
<body>

    <div class="waiting-container">
        <!-- 左侧：主区域 -->
        <div class="main-area">
            <div class="room-header">
                <h2>✨ 等待可爱的玩家加入 ✨</h2>
                <div class="room-code-display">
                    房间邀请码: <span id="display-room-code">8888</span> 
                    <button class="btn btn-small" onclick="copyCode()">复制</button>
                </div>
            </div>

            <!-- 玩家网格 -->
            <div class="players-grid" id="players-grid">
                <!-- 槽位1：自己 (房主) -->
                <div class="player-slot occupied host">
                    <div class="status-badge host-badge">👑 房主</div>
                    <div class="avatar cute-bounce">🐱</div>
                    <div class="name">小猫猫</div>
                </div>

                <!-- 槽位2：已加入的玩家 -->
                <div class="player-slot occupied">
                    <div class="status-badge">已准备</div>
                    <div class="avatar cute-bounce">🐶</div>
                    <div class="name">汪星人</div>
                </div>

                <!-- 槽位3：已加入的玩家 -->
                <div class="player-slot occupied">
                    <div class="status-badge">已准备</div>
                    <div class="avatar cute-bounce">🐰</div>
                    <div class="name">兔兔</div>
                </div>

                <!-- 槽位4：空位 -->
                <div class="player-slot empty">
                    <div class="avatar">🪑</div>
                    <div class="name">等待加入...</div>
                </div>
            </div>

            <!-- 底部按钮 -->
            <div class="action-buttons">
                <!-- 非房主玩家此处显示“准备”按钮，房主显示“开始游戏” -->
                <button class="btn" onclick="startGame()">🚀 开始游戏</button>
                <button class="btn btn-secondary" onclick="leaveRoom()">🚪 离开房间</button>
            </div>
        </div>

        <!-- 右侧：聊天框 -->
        <div class="chat-sidebar">
            <div class="chat-header">💬 房间聊天室</div>
            <div class="chat-messages" id="chat-messages">
                <div class="msg system">房间创建成功，快邀请好友加入吧！</div>
                <div class="msg system">汪星人 加入了房间</div>
                <div class="msg user"><b>汪星人:</b> 哈喽哈喽！</div>
            </div>
            <div class="chat-input">
                <input type="text" placeholder="说点什么..." id="chat-input-text">
                <button onclick="sendLobbyChat()">发送</button>
            </div>
        </div>
    </div>

    <script>
        // 复制邀请码
        function copyCode() {
            const code = document.getElementById('display-room-code').innerText;
            navigator.clipboard.writeText(code).then(() => {
                alert("🐾 邀请码 " + code + " 复制成功！快去发给小伙伴吧~");
            });
        }

        // 发送大厅聊天
        function sendLobbyChat() {
            const input = document.getElementById('chat-input-text');
            const text = input.value.trim();
            if (!text) return;
            
            const msgBox = document.getElementById('chat-messages');
            const newMsg = document.createElement('div');
            newMsg.className = 'msg user self'; // self代表自己发出的消息（靠右变蓝）
            newMsg.innerHTML = `<b>我:</b> ${text}`;
            msgBox.appendChild(newMsg);
            
            input.value = '';
            msgBox.scrollTop = msgBox.scrollHeight;
        }

        // 底层逻辑占位
        function startGame() {
            // 这里留给 AI 对接：检查是否所有人准备完毕，发送 START_GAME 指令并切换到 game.html 视图
            console.log("尝试开始游戏...");
        }

        function leaveRoom() {
            console.log("离开等待大厅");
        }
    </script>
</body>
</html>
