<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PokeWar - P2P卡牌对战</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js"></script>
</head>
<body>
    <!-- 横屏提示覆盖层 -->
    <div id="orientation-prompt" class="orientation-prompt">
        <div class="rotate-icon">🔄</div>
        <div style="margin-top:15px">请将手机旋转至横屏以获得最佳游玩体验 🐾</div>
    </div>

    <!-- 全屏 + 聊天切换悬浮按钮 -->
    <button id="btn-fullscreen" class="btn-icon">🔲</button>
    <button id="mobile-chat-toggle" class="btn-icon btn-chat-toggle">💬</button>

    <!-- Toast 容器 -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Loading 遮罩 -->
    <div class="loading-overlay hidden" id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">连接中...</div>
    </div>

    <!-- 主页 -->
    <div class="page-view active" id="page-home">
        <div class="home-container">
            <div class="home-box">
                <div class="home-logo" id="avatar-preview">🐱</div>
                <h2>PokeWar</h2>
                <p style="font-size:0.8em;color:#a0a0a0;margin-bottom:15px">点击头像选择你的 Emoji</p>
                <div class="input-group"><input type="text" id="player-name" placeholder="输入可爱的昵称..." value="小猫猫"></div>
                <div class="room-actions">
                    <button class="btn" id="btn-create-room">✨ 创建房间 (生成邀请码)</button>
                    <div class="join-group">
                        <input type="text" id="room-code" placeholder="4位邀请码" maxlength="4">
                        <button class="btn btn-secondary" id="btn-join-room">加入</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 等待大厅 -->
    <div class="page-view" id="page-waiting">
        <div class="waiting-container">
            <div class="main-area">
                <div class="room-header">
                    <h2>✨ 等待可爱的玩家加入 ✨</h2>
                    <div class="room-code-display">房间邀请码: <span id="display-room-code">----</span><button class="btn btn-small" id="btn-copy-code">复制</button></div>
                </div>
                <div class="players-grid" id="players-grid"></div>
                <div class="action-buttons">
                    <button class="btn" id="btn-start-game">🚀 开始游戏</button>
                    <button class="btn btn-leave" id="btn-leave-waiting">🚪 离开房间</button>
                </div>
            </div>
            <div class="chat-sidebar">
                <div class="chat-header">💬 房间聊天室</div>
                <div class="chat-messages" id="waiting-chat-messages"></div>
                <div class="chat-input"><input type="text" placeholder="说点什么..." id="waiting-chat-input"><button id="btn-waiting-chat-send">发送</button></div>
            </div>
        </div>
    </div>

    <!-- 游戏对局 -->
    <div class="page-view" id="page-game">
        <div class="game-main">
            <div class="opponents-area" id="opponents-container"></div>
            <div class="board-center">
                <div class="deck-info" id="deck-info">🎴 牌堆: -- | 回合: --</div>
                <div class="action-area" id="action-area">
                    <button class="btn" id="attack-btn">⚔️ 选择一个玩家，攻击</button>
                    <div class="timer-bar-bg"><div class="timer-bar-fill" id="turn-timer"></div></div>
                    <!-- A 牌面板：固定值=1，花色仅限 A自身花色 或 组合花色 -->
                    <div class="a-value-panel" id="a-value-panel">
                        <label>🃏 A牌 (固定值=1)</label>
                        <label>花色:</label>
                        <select id="a-suit-select"></select>
                    </div>
                </div>
            </div>
            <div class="game-bottom">
                <div class="self-area" id="self-container"></div>
                <div class="hand-area" id="hand-container"></div>
            </div>
        </div>
        <div class="chat-box">
            <div class="chat-header">💬 战斗聊天室</div>
            <div class="chat-messages" id="game-chat-messages"></div>
            <div class="chat-input"><input type="text" placeholder="输入聊天内容..." id="game-chat-input"><button id="btn-game-chat-send">发送</button></div>
        </div>
        <div class="spectator-notice">👻 您已阵亡，正在观战中...</div>
        <div class="anim-layer" id="anim-layer"></div>
    </div>

    <!-- 结算 -->
    <div class="page-view" id="page-result">
        <div class="result-container">
            <div class="result-panel">
                <div class="ribbon">🏆 游戏结束 🏆</div>
                <ul class="stats-list">
                    <li><span class="icon">👑</span><span class="label">最终赢家:</span><span class="value" id="stat-winner">---</span></li>
                    <li><span class="icon">⚔️</span><span class="label">战斗回合:</span><span class="value" id="stat-rounds">---</span></li>
                    <li><span class="icon">💀</span><span class="label">幸存人数:</span><span class="value" id="stat-survivors">---</span></li>
                </ul>
                <div class="result-actions">
                    <button class="btn" id="btn-restart">🔄 再来一局</button>
                    <button class="btn btn-secondary" id="btn-leave-room">🚪 退出房间</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 断线弹窗 -->
    <div class="modal-overlay" id="modal-disconnect">
        <div class="modal-box">
            <h3>😿 连接断开</h3>
            <p id="modal-disconnect-text">房主已断开连接，房间已解散。</p>
            <button class="btn" id="btn-modal-ok">返回主页</button>
        </div>
    </div>

    <!-- Emoji 选择器弹窗 -->
    <div class="modal-overlay" id="emoji-picker-dialog">
        <div class="emoji-picker-box">
            <h3>🎨 选择你的头像</h3>
            <emoji-picker id="emoji-picker"></emoji-picker>
            <button class="btn btn-small" onclick="document.getElementById('emoji-picker-dialog').classList.remove('show')">关闭</button>
        </div>
    </div>

    <!-- A牌万化选择弹窗 -->
    <div id="modal-wildcard" class="modal-overlay">
        <div class="modal-box">
            <h3>🃏 请选择 A 牌万化花色</h3>
            <p id="wildcard-desc">请选择这张 A 牌在当前组合中代表的花色：</p>
            <div id="wildcard-options" style="display: flex; gap: 15px; justify-content: center; margin: 20px 0;"></div>
            <button class="btn btn-secondary" id="btn-cancel-wildcard">取消</button>
        </div>
    </div>

    <!-- 万化组合方案选择弹窗 -->
    <div id="modal-combination" class="modal-overlay">
        <div class="modal-box" style="max-width: 600px; width: 90%;">
            <h3>🃏 请选择万化组合方案</h3>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 15px;">检测到您使用了 A 牌，请选择最终生效的牌组效果：</p>
            <div id="combo-list-container" style="display: flex; flex-direction: column; gap: 12px; max-height: 50vh; overflow-y: auto; padding: 5px;"></div>
            <div style="margin-top: 20px;">
                <button class="btn btn-secondary" id="btn-cancel-combo">取消出牌</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
